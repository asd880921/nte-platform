name: Release

# 推 tag 就發佈：git tag v1.1.0 ; git push origin v1.1.0
# （也可以在 Actions 頁面手動觸發，用來測試建置有沒有壞）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # 建立 Release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # 與開發環境一致，避免打包結果有差異

      - name: 檢查 VERSION 與 tag 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "VERSION=$version  tag=$tag"
          if ($version -ne $tag) {
            throw "VERSION ($version) 與 tag ($tag) 不一致；About 對話框會顯示錯的版本"
          }

      - name: 安裝相依套件
        run: python -m pip install --upgrade pip ; python -m pip install -r requirements.txt

      - name: 打包 (PyInstaller onedir)
        run: python -m PyInstaller --clean --noconfirm nte_platform.spec

      - name: 複製 scripts 進交付資料夾
        shell: pwsh
        run: Copy-Item scripts dist/NTE-Platform/scripts -Recurse -Force

      - name: 壓成 zip
        shell: pwsh
        # 檔名固定：README 的下載連結指向 /releases/latest/download/NTE-Platform.zip
        run: Compress-Archive -Path dist/NTE-Platform -DestinationPath dist/NTE-Platform.zip -CompressionLevel Optimal -Force

      - name: 上傳建置產物 (手動觸發時可下載檢查)
        uses: actions/upload-artifact@v4
        with:
          name: NTE-Platform
          path: dist/NTE-Platform.zip

      - name: 建立 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # 用 runner 內建的 gh CLI，不引入第三方 action
        run: gh release create "${{ github.ref_name }}" dist/NTE-Platform.zip --title "${{ github.ref_name }}" --generate-notes
